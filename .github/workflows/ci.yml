name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck the monorepo
        run: npm run typecheck

      # The BFF and shared packages run their tests from dist, so the build has
      # to come first; the web package runs its .ts tests straight off Node.
      - name: Build all packages
        run: npm run build

      # Two halves of one chain. The first derives the schema from the resolver
      # decorators and compares it to the committed file; the second derives the
      # client's types from that file. Without the first, a renamed @Field would
      # leave schema and types agreeing with each other and both wrong.
      - name: Check schema.gql matches the resolvers
        run: npm run check:schema-fresh

      - name: Check the generated GraphQL types are current
        run: npm run check:types-fresh

      - name: Run tests
        run: npm test

      # Geometry is derived from Socrata rather than committed, so this step
      # reaches upstream; it skips rather than fails when that is unreachable.
      - name: Check the geometry and bundle payload budgets
        run: npm run check:budget
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built on every pull request so a broken Dockerfile fails review, but
      # only published from main — a pull request should never produce an
      # artifact that looks promotable.
      - name: Log in to the container registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: BFF image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bff
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: GIT_SHA=${{ github.sha }}
          # Tagged by commit, never only by `latest`: a rollback needs to name
          # an exact build, and `latest` cannot be rolled back to.
          tags: |
            ghcr.io/${{ github.repository }}/bff:${{ github.sha }}
            ghcr.io/${{ github.repository }}/bff:latest
          cache-from: type=gha,scope=bff
          cache-to: type=gha,mode=max,scope=bff

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  sources:
    name: Verify upstream data sources
    runs-on: ubuntu-latest
    # Hits live Socrata and Census endpoints, so it must not gate a merge on
    # somebody else's outage — it reports, and the schedule catches drift.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build:shared

      - name: Verify every dataset id, field and assumption
        run: npm run verify:sources
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
